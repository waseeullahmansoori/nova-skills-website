<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#010d1c" />
      <stop offset="45%" stop-color="#011731" />
      <stop offset="100%" stop-color="#022852" />
    </linearGradient>
    
    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0599a8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0599a8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-orange" cx="85%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0" />
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022852" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#011731" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="card-grad-hover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0599a8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0599a8" />
      <stop offset="100%" stop-color="#FF9A3C" />
    </linearGradient>

    <filter id="shadow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glow-light" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1600" height="900" fill="url(#bg-grad)" />
  <rect width="1600" height="900" fill="url(#glow-cyan)" />
  <rect width="1600" height="900" fill="url(#glow-purple)" />
  <rect width="1600" height="900" fill="url(#glow-orange)" />

  <!-- Cyber Grid Lines -->
  <g stroke="rgba(56, 189, 248, 0.07)" stroke-width="1">
    <line x1="0" y1="150" x2="1600" y2="150" />
    <line x1="0" y1="300" x2="1600" y2="300" />
    <line x1="0" y1="450" x2="1600" y2="450" />
    <line x1="0" y1="600" x2="1600" y2="600" />
    <line x1="0" y1="750" x2="1600" y2="750" />
    <line x1="200" y1="0" x2="200" y2="900" />
    <line x1="400" y1="0" x2="400" y2="900" />
    <line x1="600" y1="0" x2="600" y2="900" />
    <line x1="800" y1="0" x2="800" y2="900" />
    <line x1="1000" y1="0" x2="1000" y2="900" />
    <line x1="1200" y1="0" x2="1200" y2="900" />
    <line x1="1400" y1="0" x2="1400" y2="900" />
  </g>

  <!-- Circuit Network Elements -->
  <g stroke="rgba(5, 153, 168, 0.25)" stroke-width="2" fill="none">
    <path d="M 120 180 L 260 180 L 320 240 L 480 240" />
    <circle cx="120" cy="180" r="4" fill="#38bdf8" />
    <circle cx="480" cy="240" r="4" fill="#0599a8" />

    <path d="M 1480 720 L 1340 720 L 1280 660 L 1120 660" />
    <circle cx="1480" cy="720" r="4" fill="#FF9A3C" />
    <circle cx="1120" cy="660" r="4" fill="#38bdf8" />
  </g>

  <!-- TOP HEADER / BRANDING -->
  <g transform="translate(100, 80)">
    <!-- Brand Icon -->
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#0599a8" />
    <polygon points="14,14 34,24 14,34 22,24" fill="#ffffff" />
    <!-- Brand Title -->
    <text x="62" y="24" class="font-sans" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="1">NOVA SKILLS</text>
    <text x="62" y="42" class="font-sans" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="2">EDUCATION INSTITUTE</text>

    <!-- Top Badge -->
    <rect x="1100" y="4" width="280" height="38" rx="19" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <circle cx="1122" cy="23" r="5" fill="#FF6B00" />
    <text x="1136" y="28" class="font-sans" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.5">FUTURE SKILLS REPORT • 2027</text>
  </g>

  <!-- MAIN TITLE & HERO HEADLINE -->
  <g transform="translate(100, 240)">
    <!-- Sub-badge -->
    <rect x="0" y="-30" width="180" height="28" rx="14" fill="rgba(255, 107, 0, 0.15)" stroke="rgba(255, 107, 0, 0.4)" stroke-width="1" />
    <text x="14" y="-12" class="font-sans" font-size="12" font-weight="800" fill="#FF9A3C" letter-spacing="1">CAREER GUIDANCE</text>

    <!-- Massive Title -->
    <text x="0" y="60" class="font-sans" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">
      15 High-Demand Courses
    </text>
    <text x="0" y="135" class="font-sans" font-size="64" font-weight="900" fill="url(#text-gradient)" letter-spacing="-1">
      for 2027
    </text>

    <!-- Supporting Line -->
    <text x="0" y="195" class="font-sans" font-size="22" font-weight="600" fill="#cbd5e1" letter-spacing="0.5">
      Skills, AI Tools &amp; Career Opportunities in the Next Economy
    </text>

    <!-- Feature Pillars -->
    <g transform="translate(0, 245)">
      <rect x="0" y="0" width="220" height="42" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="18" y="26" class="font-sans" font-size="14" font-weight="700" fill="#38bdf8">⚡ AI &amp; Automation</text>

      <rect x="235" y="0" width="210" height="42" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="253" y="26" class="font-sans" font-size="14" font-weight="700" fill="#75d766">🛡️ Cyber &amp; Cloud</text>

      <rect x="460" y="0" width="220" height="42" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="478" y="26" class="font-sans" font-size="14" font-weight="700" fill="#FF9A3C">🎨 Design &amp; Digital</text>
    </g>
  </g>

  <!-- 3D FLOATING TECH & COURSE CARDS (Right Side Showcase) -->
  <g transform="translate(940, 190)">
    
    <!-- Card 1: AI & Intelligent Agents -->
    <g filter="url(#shadow-card)" transform="translate(0, 0)">
      <rect width="560" height="110" rx="18" fill="url(#card-grad-1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
      <rect width="560" height="110" rx="18" fill="url(#card-grad-hover)" />
      
      <!-- Icon Box -->
      <rect x="24" y="24" width="62" height="62" rx="14" fill="rgba(5, 153, 168, 0.2)" stroke="rgba(5, 153, 168, 0.5)" />
      <text x="39" y="65" font-size="30">🤖</text>
      
      <text x="104" y="50" class="font-sans" font-size="19" font-weight="800" fill="#ffffff">Generative AI &amp; Agentic Workflows</text>
      <text x="104" y="75" class="font-sans" font-size="13" font-weight="600" fill="#94a3b8">LLMs • LangChain • Prompting • n8n Automations</text>
      
      <rect x="440" y="38" width="96" height="34" rx="8" fill="rgba(56, 189, 248, 0.15)" />
      <text x="456" y="60" class="font-sans" font-size="12" font-weight="700" fill="#38bdf8">#1 Priority</text>
    </g>

    <!-- Card 2: Full-Stack & Cloud Architecture -->
    <g filter="url(#shadow-card)" transform="translate(40, 135)">
      <rect width="560" height="110" rx="18" fill="url(#card-grad-1)" stroke="rgba(117, 215, 102, 0.3)" stroke-width="1.5" />
      <rect width="560" height="110" rx="18" fill="url(#card-grad-hover)" />
      
      <!-- Icon Box -->
      <rect x="24" y="24" width="62" height="62" rx="14" fill="rgba(117, 215, 102, 0.15)" stroke="rgba(117, 215, 102, 0.4)" />
      <text x="39" y="65" font-size="30">💻</text>
      
      <text x="104" y="50" class="font-sans" font-size="19" font-weight="800" fill="#ffffff">Full-Stack Web &amp; Cloud DevOps</text>
      <text x="104" y="75" class="font-sans" font-size="13" font-weight="600" fill="#94a3b8">React • Next.js • Docker • AWS • Cursor AI</text>
      
      <rect x="440" y="38" width="96" height="34" rx="8" fill="rgba(117, 215, 102, 0.15)" />
      <text x="454" y="60" class="font-sans" font-size="12" font-weight="700" fill="#75d766">High Growth</text>
    </g>

    <!-- Card 3: Performance Marketing, SEO & GEO -->
    <g filter="url(#shadow-card)" transform="translate(10, 270)">
      <rect width="560" height="110" rx="18" fill="url(#card-grad-1)" stroke="rgba(255, 107, 0, 0.3)" stroke-width="1.5" />
      <rect width="560" height="110" rx="18" fill="url(#card-grad-hover)" />
      
      <!-- Icon Box -->
      <rect x="24" y="24" width="62" height="62" rx="14" fill="rgba(255, 107, 0, 0.15)" stroke="rgba(255, 107, 0, 0.4)" />
      <text x="39" y="65" font-size="30">📈</text>
      
      <text x="104" y="50" class="font-sans" font-size="19" font-weight="800" fill="#ffffff">Digital Marketing, GEO &amp; Analytics</text>
      <text x="104" y="75" class="font-sans" font-size="13" font-weight="600" fill="#94a3b8">Google Ads • Meta Advantage+ • GA4 • AI Search</text>
      
      <rect x="440" y="38" width="96" height="34" rx="8" fill="rgba(255, 107, 0, 0.15)" />
      <text x="456" y="60" class="font-sans" font-size="12" font-weight="700" fill="#FF9A3C">In Demand</text>
    </g>

    <!-- Card 4: UI/UX & Creative Digital Arts -->
    <g filter="url(#shadow-card)" transform="translate(50, 405)">
      <rect width="560" height="110" rx="18" fill="url(#card-grad-1)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1.5" />
      <rect width="560" height="110" rx="18" fill="url(#card-grad-hover)" />
      
      <!-- Icon Box -->
      <rect x="24" y="24" width="62" height="62" rx="14" fill="rgba(192, 132, 252, 0.15)" stroke="rgba(192, 132, 252, 0.4)" />
      <text x="39" y="65" font-size="30">🎨</text>
      
      <text x="104" y="50" class="font-sans" font-size="19" font-weight="800" fill="#ffffff">UI/UX Design, 3D &amp; Motion Graphics</text>
      <text x="104" y="75" class="font-sans" font-size="13" font-weight="600" fill="#94a3b8">Figma • Blender • Premiere Pro • After Effects</text>
      
      <rect x="440" y="38" width="96" height="34" rx="8" fill="rgba(192, 132, 252, 0.15)" />
      <text x="456" y="60" class="font-sans" font-size="12" font-weight="700" fill="#c084fc">Creative Core</text>
    </g>

  </g>

  <!-- BOTTOM BAR / BRAND MOTTO -->
  <g transform="translate(100, 810)">
    <line x1="0" y1="0" x2="1400" y2="0" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    
    <text x="0" y="42" class="font-sans" font-size="14" font-weight="800" fill="#38bdf8" letter-spacing="2">
      LEARN • GROW • ACHIEVE
    </text>
    
    <text x="260" y="42" class="font-sans" font-size="13" font-weight="500" fill="#94a3b8">
      Industry-Aligned Curriculum • ISO 9001:2015 Standards • Practical Live Portfolios
    </text>

    <text x="1260" y="42" class="font-sans" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.5">
      novaskills.in/blog
    </text>
  </g>

</svg>