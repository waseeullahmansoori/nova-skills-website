<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration — Nova Skills Education Institute</title>
  <meta name="description" content="Create a new student account for Nova Skills courses, AI Career Advisor, and admissions.">
  <link rel="stylesheet" href="/css/styles.min.css?v=1.1.0">
  <style>
    :root {
      --bg-dark: #011731;
      --card-bg: rgba(2, 34, 69, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-cyan: #0599a8;
      --accent-light: #38bdf8;
    }

    body {
      background: var(--bg-dark) radial-gradient(circle at top right, rgba(5, 153, 168, 0.15), transparent 60%);
      color: #ffffff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 30px 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-brand {
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
    }
    .auth-brand span { color: var(--accent-light); }

    .auth-subtitle {
      font-size: 0.88rem;
      color: #94a3b8;
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.84rem;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 11px 14px;
      color: #fff;
      font-size: 0.92rem;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent-light);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }

    .password-hint {
      font-size: 0.74rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    .checkbox-label {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 0.82rem;
      color: #cbd5e1;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .auth-btn {
      width: 100%;
      background: var(--accent-cyan);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .auth-btn:hover {
      background: #028491;
      box-shadow: 0 6px 20px rgba(5, 153, 168, 0.4);
    }

    .auth-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.88rem;
      color: #94a3b8;
    }

    .auth-link {
      color: var(--accent-light);
      text-decoration: none;
      font-weight: 600;
    }
    .auth-link:hover { text-decoration: underline; }

    .alert {
      padding: 12px;
      border-radius: 8px;
      font-size: 0.84rem;
      margin-bottom: 18px;
      display: none;
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
    }
    .alert-success {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #4ade80;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-brand">Nova <span>Skills</span></div>
      <div class="auth-subtitle">Create your Student Account</div>
    </div>

    <div class="alert alert-error" id="alert-error"></div>
    <div class="alert alert-success" id="alert-success"></div>

    <form id="register-form" onsubmit="handleRegister(event)">
      <div class="form-row-2">
        <div class="form-group">
          <label for="firstName" class="form-label">First Name</label>
          <input type="text" id="firstName" class="form-input" placeholder="Rahul" required>
        </div>
        <div class="form-group">
          <label for="lastName" class="form-label">Last Name</label>
          <input type="text" id="lastName" class="form-input" placeholder="Sharma" required>
        </div>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="rahul@example.com" required>
      </div>

      <div class="form-group">
        <label for="phone" class="form-label">Mobile Number</label>
        <input type="tel" id="phone" class="form-input" placeholder="9876543210" required>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        <div class="password-hint">Min 8 characters (Must include uppercase, lowercase & number)</div>
      </div>

      <div class="form-group">
        <label for="confirmPassword" class="form-label">Confirm Password</label>
        <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required>
      </div>

      <label class="checkbox-label">
        <input type="checkbox" id="terms" required>
        <span>I agree to the <a href="/terms-and-conditions/" class="auth-link" target="_blank">Terms & Conditions</a> and <a href="/privacy-policy/" class="auth-link" target="_blank">Privacy Policy</a></span>
      </label>

      <button type="submit" class="auth-btn" id="submit-btn">Create Student Account →</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login.html" class="auth-link">Log In</a>
    </div>
  </div>

  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const termsChecked = document.getElementById('terms').checked;

      const btn = document.getElementById('submit-btn');
      const errAlert = document.getElementById('alert-error');
      const succAlert = document.getElementById('alert-success');

      errAlert.style.display = 'none';
      succAlert.style.display = 'none';

      // Field-specific validations
      if (!firstName) {
        errAlert.textContent = 'Please enter your first name.';
        errAlert.style.display = 'block';
        return;
      }
      if (!lastName) {
        errAlert.textContent = 'Please enter your last name.';
        errAlert.style.display = 'block';
        return;
      }
      if (!email || !email.includes('@') || !email.includes('.')) {
        errAlert.textContent = 'Please enter a valid email address.';
        errAlert.style.display = 'block';
        return;
      }
      if (!phone || phone.length < 10) {
        errAlert.textContent = 'Please enter a valid 10-digit mobile number.';
        errAlert.style.display = 'block';
        return;
      }
      if (!password || password.length < 8) {
        errAlert.textContent = 'Password must be at least 8 characters long.';
        errAlert.style.display = 'block';
        return;
      }
      if (password !== confirmPassword) {
        errAlert.textContent = 'Passwords do not match. Please re-enter your password.';
        errAlert.style.display = 'block';
        return;
      }
      if (!termsChecked) {
        errAlert.textContent = 'You must agree to the Terms & Conditions and Privacy Policy.';
        errAlert.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating Account...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            firstName,
            lastName,
            email,
            phone,
            password,
            role: 'Student'
          })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          btn.textContent = 'Account Created! ✓';
          succAlert.textContent = 'Account created successfully! Redirecting to login...';
          succAlert.style.display = 'block';
          document.getElementById('register-form').reset();

          setTimeout(() => {
            window.location.href = '/login.html';
          }, 1500);
          return;
        } else {
          btn.disabled = false;
          btn.textContent = 'Create Student Account →';
          errAlert.textContent = data.message || data.error?.message || data.error || 'Failed to register account. Email may already be in use.';
          errAlert.style.display = 'block';
          return;
        }
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Create Student Account →';

        const demoUser = {
          userId: 'usr_' + Date.now(),
          firstName,
          lastName,
          name: `${firstName} ${lastName}`,
          email,
          phone,
          role: 'Student'
        };
        localStorage.setItem('novaskills_user', JSON.stringify(demoUser));

        succAlert.textContent = 'Account created successfully! Redirecting to login...';
        succAlert.style.display = 'block';
        document.getElementById('register-form').reset();

        setTimeout(() => {
          window.location.href = '/login.html';
        }, 1200);
      }
    }
  </script>
</body>
</html>
