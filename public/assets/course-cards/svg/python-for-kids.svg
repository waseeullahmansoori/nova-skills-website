    <text x="136" y="280" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#e2e8f0">pen.forward(120)</text>
    <text x="136" y="308" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#e2e8f0">pen.right(170)</text>
    <text x="116" y="346" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#f472b6">print("Quiz Score:", 10)</text>
