    <text x="116" y="196" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#7dd3fc">import turtle</text>
    <text x="116" y="224" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#facc15">pen = turtle.Turtle()</text>
