    <rect x="92" y="320" width="616" height="150" rx="10" fill="#071324" stroke="rgba(5,153,168,0.4)"/>
    <text x="112" y="350" font-family="monospace" font-size="12" font-weight="700" fill="#7dd3fc">SELECT c.title, COUNT(e.enroll_id) AS total FROM enrollments e</text>
    <text x="112" y="376" font-family="monospace" font-size="12" font-weight="700" fill="#75d766">INNER JOIN courses c ON e.course_id = c.course_id GROUP BY c.title;</text>
