    <text x="110" y="180" font-family="monospace" font-size="12" font-weight="800" fill="#fff">students</text>
    <text x="110" y="212" font-family="monospace" font-size="11.5" fill="#fbbf24">PK  student_id</text>
    <text x="110" y="236" font-family="monospace" font-size="11.5" fill="#e2e8f0">    full_name</text>
    <text x="110" y="260" font-family="monospace" font-size="11.5" fill="#e2e8f0">    city_slug</text>
    <rect x="316" y="160" width="194" height="140" rx="10" fill="#132d52" stroke="#75d766"/>
    <rect x="316" y="160" width="194" height="30" rx="10" fill="#047857"/>
    <text x="334" y="180" font-family="monospace" font-size="12" font-weight="800" fill="#fff">enrollments</text>
    <text x="334" y="212" font-family="monospace" font-size="11.5" fill="#fbbf24">PK  enroll_id</text>
    <text x="334" y="236" font-family="monospace" font-size="11.5" fill="#7dd3fc">FK  student_id</text>
    <text x="334" y="260" font-family="monospace" font-size="11.5" fill="#7dd3fc">FK  course_id</text>
    <rect x="546" y="160" width="162" height="140" rx="10" fill="#132d52" stroke="#0599a8"/>
