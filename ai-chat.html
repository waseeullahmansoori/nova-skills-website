<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9WN9N2KF12"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-9WN9N2KF12');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>AI Advisor — Nova Skills</title>
  <noscript><link rel="stylesheet" href="/css/styles.min.css" /></noscript>
  <!-- Critical Self-Hosted Fonts Preload -->
  <link rel="preload" href="/public/fonts/PlusJakartaSans-700.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/public/fonts/Inter-400.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    body {
      background-color: #0b132b;
      color: #f0f4f8;
      font-family: 'Inter', sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .chat-header {
      background: #011731;
      padding: 1rem 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem;
      overflow: hidden;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding-right: 0.5rem;
    }
    .message-bubble {
      max-width: 80%;
      padding: 1rem 1.25rem;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 0.95rem;
      position: relative;
    }
    .message-bubble.user {
      align-self: flex-end;
      background: #0599a8;
      color: white;
      border-bottom-right-radius: 2px;
    }
    .message-bubble.assistant {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f0f4f8;
      border-bottom-left-radius: 2px;
    }
    .copy-btn {
      font-size: 0.75rem;
      color: #94a3b8;
      background: none;
      border: none;
      cursor: pointer;
      margin-top: 0.5rem;
      display: inline-block;
    }
    .copy-btn:hover {
      color: #38bdf8;
    }
    .chat-input-area {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .chat-input {
      flex: 1;
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.2);
      color: white;
      font-size: 1rem;
    }
    .btn-chat {
      background: #0599a8;
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-chat:hover {
      background: #028491;
    }
    .loading-indicator {
      display: none;
      align-self: flex-start;
      color: #38bdf8;
      font-size: 0.875rem;
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- Chat Header -->
  <header class="chat-header">
    <div>
      <h3 style="margin:0;color:#0599a8;">🤖 Nova Skills AI Advisor</h3>
      <span style="font-size:0.8rem;color:#94a3b8;">Powered by OpenAI GPT-5.5 via Cloudflare Gateway</span>
    </div>
    <button class="btn-chat" style="background:rgba(255,255,255,0.1);font-size:0.875rem;" onclick="clearChat()">Clear Chat</button>
  </header>

  <!-- Chat Area -->
  <main class="chat-container">
    <div class="chat-messages" id="chatMessages">
      <div class="message-bubble assistant">
        Hello! I am your Nova Skills AI Advisor. How can I help you today with course details, fees, duration, batch timings, or career guidance?
      </div>
    </div>

    <div class="loading-indicator" id="loadingIndicator">
      AI Advisor is thinking...
    </div>

    <div class="chat-input-area">
      <input type="text" class="chat-input" id="userInput" placeholder="Ask about fees, duration, placement, or course recommendations..." onkeypress="handleKeyPress(event)">
      <button class="btn-chat" onclick="sendMessage()">Send</button>
    </div>
  </main>

  <script src="ai-chat.js"></script>
</body>
</html>
