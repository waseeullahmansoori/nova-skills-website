<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal — Nova Skills Enterprise Platform</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0b132b;
      color: #f0f4f8;
      font-family: 'Inter', sans-serif;
      margin: 0;
      display: flex;
      min-height: 100vh;
    }
    .student-sidebar {
      width: 260px;
      background: #011731;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1rem;
    }
    .sidebar-brand {
      font-size: 1.25rem;
      font-weight: 800;
      color: #0599a8;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .sidebar-menu {
      list-style: none;
      padding: 0;
      margin: 0;
      flex-grow: 1;
    }
    .sidebar-item {
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
      border-radius: 8px;
      cursor: pointer;
      color: #94a3b8;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .sidebar-item:hover, .sidebar-item.active {
      background: rgba(5, 153, 168, 0.15);
      color: #38bdf8;
      font-weight: 600;
    }
    .student-main {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
    }
    .student-header {
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .profile-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      backdrop-filter: blur(10px);
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      color: #94a3b8;
      font-size: 0.875rem;
      margin-bottom: 0.25rem;
    }
    .form-control {
      width: 100%;
      max-width: 400px;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.2);
      color: white;
    }
    .form-control[readonly] {
      background: rgba(255, 255, 255, 0.05);
      color: #64748b;
      cursor: not-allowed;
    }
    .btn-student {
      background: #0599a8;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-student:hover {
      background: #028491;
    }
    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>

  <!-- Student Sidebar -->
  <aside class="student-sidebar">
    <div class="sidebar-brand">🎓 Student Portal</div>
    <ul class="sidebar-menu">
      <li class="sidebar-item active" onclick="switchStudentSection('dashboard')">📊 Dashboard</li>
      <li class="sidebar-item" onclick="switchStudentSection('profile')">👤 My Profile</li>
      <li class="sidebar-item" onclick="switchStudentSection('courses')">📚 My Courses</li>
      <li class="sidebar-item" onclick="switchStudentSection('files')">📁 My Files</li>
    </ul>
    <button class="btn-student" style="background:#ef4444;" onclick="logoutStudent()">Logout</button>
  </aside>

  <!-- Student Main Panel -->
  <main class="student-main">
    <header class="student-header">
      <h2 id="student-greeting">Welcome back, Rohan Verma!</h2>
      <p style="color:#94a3b8;margin:0;">Student Code: <strong style="color:#38bdf8;" id="display-student-code">STU-1001</strong></p>
    </header>

    <div id="student-section-content">
      <!-- Populated dynamically by student.js -->
    </div>
  </main>

  <script src="student.js"></script>
  <script src="nova-ai-widget.js?v=3.0" defer></script>
</body>
</html>
