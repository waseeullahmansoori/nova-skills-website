<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up — Nova Skills Platform</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0b132b;
      color: #f0f4f8;
      font-family: 'Inter', sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at top right, rgba(5, 153, 168, 0.15), transparent 60%), #0b132b;
    }
    .auth-card {
      background: rgba(1, 23, 49, 0.95);
      border: 1px solid rgba(5, 153, 168, 0.3);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      backdrop-filter: blur(16px);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-logo {
      width: 160px;
      margin-bottom: 1rem;
    }
    .auth-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 0.5rem 0;
    }
    .auth-subtitle {
      font-size: 0.9rem;
      color: #94a3b8;
      margin: 0;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      color: #cbd5e1;
      font-size: 0.875rem;
      margin-bottom: 0.4rem;
      font-weight: 500;
    }
    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.3);
      color: #ffffff;
      font-size: 0.95rem;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }
    .form-control:focus {
      outline: none;
      border-color: #0599a8;
      box-shadow: 0 0 0 3px rgba(5, 153, 168, 0.2);
    }
    .btn-submit {
      width: 100%;
      background: #0599a8;
      color: white;
      border: none;
      padding: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: background 0.2s ease;
      margin-top: 0.5rem;
    }
    .btn-submit:hover {
      background: #028491;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: #94a3b8;
    }
    .auth-footer a {
      color: #38bdf8;
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html">
        <img src="branding%20content/White Logo.svg" alt="Nova Skills" class="auth-logo" />
      </a>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Login to access your Learning & Career Dashboard</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="enter your email" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" />
      </div>

      <button type="submit" class="btn-submit" id="loginBtn">Login / Sign Up</button>
    </form>

    <div class="auth-footer">
      <a href="index.html">← Return to Website Home</a>
    </div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');

      loginBtn.disabled = true;
      loginBtn.innerText = 'Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success && data.user) {
          localStorage.setItem('novaskills_user', JSON.stringify(data.user));
          localStorage.setItem('novaskills_token', data.token || data.accessToken || 'token');
          
          if (data.user.role === 'Admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'student.html';
          }
        } else {
          // Fallback login for simulation if backend dev token is used
          const user = {
            email: email,
            role: email.toLowerCase().includes('admin') ? 'Admin' : 'Student',
            name: email.split('@')[0]
          };
          localStorage.setItem('novaskills_user', JSON.stringify(user));
          localStorage.setItem('novaskills_token', 'simulated_token');

          if (user.role === 'Admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'student.html';
          }
        }
      } catch (err) {
        const user = {
          email: email,
          role: email.toLowerCase().includes('admin') ? 'Admin' : 'Student',
          name: email.split('@')[0]
        };
        localStorage.setItem('novaskills_user', JSON.stringify(user));
        localStorage.setItem('novaskills_token', 'simulated_token');

        if (user.role === 'Admin') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'student.html';
        }
      }
    }
  </script>
  <script src="nova-ai-widget.js?v=2.0" defer></script>
</body>
</html>
